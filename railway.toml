[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Standalone Next.js output — no `next` binary in the runtime image.
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Link Postgres + Qdrant in the Railway dashboard, then set:
#   DATABASE_URL  (reference from Postgres)
#   QDRANT_URL    (from Qdrant template)
#   AUTH_SECRET, NEXT_PUBLIC_APP_URL, GEMINI_API_KEY
# See docs/RAILWAY.md
